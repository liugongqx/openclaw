name: Development workflow gates

on:
  pull_request:
  push:
    branches: [local-first]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-contract:
    name: Development workflow contract (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.22.0"
          package-manager-cache: false
      - name: Syntax and deliberate-failure contract tests
        run: node --test scripts/dev-workflow.test.mjs
      - name: Real isolated red-to-green HTTP acceptance demonstration
        run: node scripts/dev-workflow-demo.mjs
